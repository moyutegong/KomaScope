# electron-builder 配置(§9.2 / M5):Windows NSIS 安装包
appId: com.komascope.app
productName: KomaScope
copyright: Copyright © 2025 KomaScope contributors

directories:
  buildResources: resources
  output: dist

files:
  - out/**
  - package.json

# sharp(libvips)含原生二进制,必须从 asar 解包才能被 require
asarUnpack:
  - node_modules/sharp/**
  - node_modules/@img/**

# 窗口图标随包分发:主进程从 process.resourcesPath 读取
extraResources:
  - from: resources/window-icon.png
    to: window-icon.png

# 主平台(§1.2):Windows ★★★;macOS 后期适配
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.png
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: KomaScope
  deleteAppDataOnUninstall: false

# macOS(后期适配,§1.2)
mac:
  target:
    - dmg
  category: public.app-category.graphics-design

publish:
  provider: github
  owner: moyutegong
  repo: KomaScope
