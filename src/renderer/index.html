<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' komascope-file: komascope-thumb: blob:; connect-src 'self' komascope-file: komascope-thumb:; style-src 'self' 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KomaScope</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <header id="toolbar" class="toolbar">
        <button id="btn-sidebar" class="toolbar-btn" type="button" title="切换侧栏 / Toggle sidebar">
          <i data-lucide="panel-left"></i>
        </button>
        <button id="btn-open-folder" class="toolbar-btn" type="button">
          <i data-lucide="folder-open"></i>
          <span data-i18n="toolbar.openFolder">打开文件夹</span>
        </button>
        <button id="btn-library" class="toolbar-btn" type="button" title="书库目录 / Library folder">
          <i data-lucide="library"></i>
          <span data-i18n="toolbar.library">书库目录</span>
        </button>
        <button id="btn-browse" class="toolbar-btn" type="button" title="缩略图浏览 / Thumbnail browser">
          <i data-lucide="layout-grid"></i>
          <span data-i18n="toolbar.browse">缩略图浏览</span>
        </button>
        <button
          id="btn-library-root"
          class="toolbar-btn"
          type="button"
          title="返回书库目录 / Back to library"
        >
          <i data-lucide="house"></i>
          <span data-i18n="toolbar.libraryRoot">返回书库</span>
        </button>
        <button id="btn-fit-screen" class="toolbar-btn" type="button" title="铺满当前显示器工作区">
          <i data-lucide="maximize"></i>
          <span data-i18n="toolbar.fitScreen">适应屏幕</span>
        </button>
        <button id="btn-immersive" class="toolbar-btn" type="button" title="沉浸模式 / Immersive mode">
          <i data-lucide="scan"></i>
          <span data-i18n="toolbar.immersive">沉浸模式</span>
        </button>
        <button id="btn-auto-hide" class="toolbar-btn" type="button" title="自动隐藏工具栏/侧栏 / Auto-hide UI">
          <i data-lucide="mouse-pointer-click"></i>
        </button>
        <button id="btn-view-mode" class="toolbar-btn" type="button" title="长图模式 / Long strip">
          <i data-lucide="rows-3"></i>
        </button>
        <span id="toolbar-folder" class="toolbar-folder" data-i18n="toolbar.noFolder">未打开文件夹</span>
        <span class="toolbar-spacer"></span>
        <span class="win-controls">
          <button id="btn-win-min" class="toolbar-btn win-btn" type="button" title="最小化 / Minimize">
            <i data-lucide="minus"></i>
          </button>
          <button id="btn-win-max" class="toolbar-btn win-btn" type="button" title="最大化 / Maximize">
            <i data-lucide="square"></i>
          </button>
          <button id="btn-win-close" class="toolbar-btn win-btn win-btn-close" type="button" title="关闭 / Close">
            <i data-lucide="x"></i>
          </button>
        </span>
      </header>

      <div id="body" class="body">
        <aside id="sidebar" class="sidebar">
          <div class="sidebar-section" id="sidebar-history-section">
            <h3 class="sidebar-title" data-i18n="sidebar.history">历史</h3>
            <div id="sidebar-history" class="sidebar-list"></div>
          </div>
          <div id="sidebar-divider" class="sidebar-divider" title="拖动调整区块比例"></div>
          <div class="sidebar-section" id="sidebar-pages-section">
            <h3 class="sidebar-title" data-i18n="sidebar.pages">图片</h3>
            <div id="sidebar-pages" class="sidebar-list"></div>
          </div>
        </aside>

        <main id="viewport" class="viewport">
          <canvas id="canvas" class="canvas" hidden></canvas>
          <div id="long-view" class="long-view" hidden></div>
          <div id="browser" class="browser" hidden>
            <div class="browser-bar">
              <button
                id="btn-browser-up"
                class="toolbar-btn browser-bar-btn"
                type="button"
                data-i18n-title="browser.back"
                title="返回上级"
              >
                <i data-lucide="corner-left-up"></i>
              </button>
              <button
                id="btn-browser-root"
                class="toolbar-btn browser-bar-btn"
                type="button"
                data-i18n-title="browser.root"
                title="书库根目录"
              >
                <i data-lucide="library"></i>
              </button>
              <nav id="browser-crumbs" class="browser-crumbs"></nav>
              <span class="toolbar-spacer"></span>
              <button
                id="btn-browser-read"
                class="toolbar-btn browser-bar-btn"
                type="button"
                title="阅读本文件夹 / Read this folder"
                data-i18n-title="browser.readAll"
                hidden
              >
                <i data-lucide="book-open"></i>
                <span data-i18n="browser.readAll">阅读本文件夹</span>
              </button>
              <span id="browser-count" class="browser-count"></span>
            </div>
            <p id="browser-notice" class="browser-notice" hidden></p>
            <div id="browser-scroll" class="browser-scroll">
              <section id="browser-recent" class="browser-recent" hidden>
                <h3 class="browser-section-title" data-i18n="browser.continue">继续阅读</h3>
                <div id="browser-recent-list" class="browser-recent-list"></div>
              </section>
              <div id="browser-grid" class="browser-grid"></div>
              <p id="browser-empty" class="browser-empty" hidden></p>
            </div>
          </div>
          <div id="placeholder" class="placeholder">
            <i data-lucide="book-open" class="placeholder-icon"></i>
            <p data-i18n="app.title">KomaScope</p>
            <p class="hint" data-i18n="placeholder.hint">打开文件夹或拖入图片开始阅读</p>
          </div>
        </main>
      </div>

      <footer id="statusbar" class="statusbar">
        <span id="status-page">— / —</span>
        <span id="status-size">—</span>
        <span id="status-zoom">缩放 —</span>
        <span id="status-resume" class="status-resume" hidden></span>
        <span id="status-busy" class="status-busy" data-i18n="status.busy" hidden>解码中…</span>
        <span id="status-lock" data-i18n-title="status.lockTitle" hidden>
          <i data-lucide="lock"></i>
        </span>
      </footer>
    </div>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
