name: 功能请求
description: 为 KomaScope 提出新功能或改进建议
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: 感谢你为 KomaScope 提出建议!请先搜索已有 Issue,避免重复。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 这个功能解决什么场景/痛点?
      placeholder: 我在 4K 屏上阅读时,经常需要……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
      description: 你希望它如何工作?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他做法(可选)
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: 适用范围
      options:
        - label: 与 4K / HiDPI 显示相关
        - label: 与阅读交互(翻页/缩放/锁定)相关
        - label: 与新格式 / 数据源(如 cbz/zip)相关
        - label: 其他(请在描述中说明)
