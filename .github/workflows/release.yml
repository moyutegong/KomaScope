name: Release

# 推送 v* tag 时构建 NSIS 安装包并发布到 GitHub Release(§9.2)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run typecheck && pnpm test

      - name: Build installers (NSIS)
        # 构建阶段不发布(build:win 已内置 --publish never),由下方 action-gh-release 统一上传
        run: pnpm build:win

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.exe
          generate_release_notes: true
