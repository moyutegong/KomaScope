name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm test

  build:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installers (NSIS)
        # --publish never:CI 上禁止 electron-builder 自动发布(push 无 tag 时
        # 也会因 publish 配置尝试发布导致失败;发布由 release.yml 显式执行)
        run: pnpm build:win -- --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: komascope-installer
          path: dist/*.exe
